[package]
name = "ldaphound-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Parser and AI-ready relationship graph for ADExplorer snapshots and LDAP LDIF"

[lib]
name = "ldaphound_core"
path = "src/lib.rs"

[[bin]]
name = "ldaphound-cli"
path = "src/bin/cli.rs"

[dependencies]
memmap2 = "0.9"
thiserror = "2"
clap = { version = "4.0", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
